name: ci

# The template is checked twice: its scripts by their hermetic suites, and its Spec Kit kit by
# regenerating it with the pinned CLI and comparing (scripts/build-speckit-kit.sh --check), so that
# template/ can never hold skills nobody generated.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scripts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: lint
        run: |
          for f in setup-speckit.sh bootstrap.sh scripts/check-linkage.sh scripts/adopt.sh scripts/build-speckit-kit.sh template/scripts/check-speckit.sh .claude/hooks/linkage-guard.sh .githooks/pre-push; do
            bash -n "$f"
          done
      - name: tests
        run: |
          rc=0
          for t in .claude/hooks/*_test.sh .githooks/*_test.sh scripts/*_test.sh template/scripts/check-speckit_test.sh; do
            bash "$t" || rc=1
          done
          [ "$rc" = 0 ]

  kit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: install Spec Kit at the version the kit is built with
        run: |
          version="$(sed -n 's/^KIT_VERSION=//p' scripts/build-speckit-kit.sh)"
          pipx install "git+https://github.com/github/spec-kit.git@v${version}"
      - name: template/ is what Spec Kit generates
        run: bash scripts/build-speckit-kit.sh --check
